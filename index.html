<!DOCTYPE>
<html>
  <head>
    <title>Tien Games</title>

    <style>
      .butt {
      position: absolute;
      width: 140px;
      height: 60px;
      font-size: 18px;
      color: white;
      border-radius: 15px;
      cursor: pointer;
      transition: transform 0.15s;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      }
      .butt:hover {
        filter: brightness(1.2);
        transform: scale(0.90);
        border: 5px solid gray;
      }
      .butt:active {
        transform: scale(0.90);
        border: 5px solid gray;
      }
    </style>
  </head>
  <body>
    <div id="1">
    <h1 style="text-align: center; color: lightblue;">
    Welcome to Tien Games🥳
    </h1> <hr>
    <h3 style="text-align: center;">
      Here are some options for you to choose from
    </h3> <br> <br>
      
    <button onclick="OG()"
      class="butt" style="
      left: 15%;
      background-color: green;
    ">Play Games</button>
    
    <button onclick="OT()"
      class="butt" style="
      left: 40%;
      background-color: blue;
    ">Tutorial</button>

    <button onclick="OI()"
      class="butt" style="
      left: 65%;
      background-color: brown;
      ">Introduce</button>
    </div>
    <audio src="Fur-Elise.mp3" controls autoplay loop></audio>
    
    <div id="3">
      
    </div>

    <script>
      function OI() {
        document.getElementById("1").style.display = "none";
        document.getElementById("3").style.display = "block";
      }
    </script>
  </body>
</html>
