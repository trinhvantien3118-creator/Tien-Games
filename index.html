<!DOCTYPE html>
<html>
  <head>
    <title>Tien Games</title>

    <style>
      .butt {
      position: absolute;
      width: 140px;
      height: 60px;
      font-size: 18px;
      color: white;
      border-radius: 15px;
      cursor: pointer;
      transition: transform 0.15s;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      }
      .butt:hover {
        filter: brightness(1.2);
        transform: scale(0.90);
        border: 5px solid gray;
      }
      .butt:active {
        transform: scale(0.90);
        border: 5px solid gray;
      }
    </style>
  </head>
  <body>
    
 <!-- Div main ở đây nhe -->
    
    <div id="Main">
    <h1 style="text-align: center; color: lightblue;">
    Welcome to Tien Games🥳
    </h1> <hr>
    <h3 style="text-align: center;">
      Here are some options for you to choose from
    </h3> <br> <br>
      
    <button onclick="OG()"
      class="butt" style="
      left: 15%;
      background-color: green;
    ">Play Games</button>
    
    <button onclick="OT()"
      class="butt" style="
      left: 40%;
      background-color: blue;
    ">Tutorial</button>

    <button onclick="OI()"
      class="butt" style="
      left: 65%;
      background-color: brown;
      ">Introduce</button>
    </div>
    <audio src="Fur-Elise.mp3" controls autoplay loop></audio>

<!-- Div games ở đây nhe -->
    
    <div id="Games" style="display: none;">
      <button onclick="OM()"
      class="butt" style="
      left: 5%;
      background-color: orange;
      ">Get Back🔙</button> <br>
      <h1 style="
        color: brown;
        text-align: center;
        ">
        Games</h1>
      <hr>
    </div>

 <!-- Div tutorial ở đây nhe -->
    
    <div id="Tutor" style="display: none;">
      <button onclick="OM()"
      class="butt" style="
      left: 5%;
      background-color: orange;
      ">Get Back🔙</button> <br>
      <h1 style="
        color: blue;
        text-align: center;
        ">
        Tutorial</h1>
      <hr>
    </div>

<!-- Div introduce ở đây nhe -->
    
    <div id="Intro" style="display: none;">
      <button onclick="OM()"
      class="butt" style="
      left: 5%;
      background-color: orange;
      ">Get Back🔙</button> <br>
      <h1 style="
        color: lightblue;
        text-align: center;
        ">
        Introduce</h1>
      <hr>
    </div>

    <script>
      function OM() {
        document.getElementById("Main").style.display = "block";
        document.getElementById("Games").style.display = "none";
        document.getElementById("Tutor").style.display = "none";
        document.getElementById("Intro").style.display = "none";
      }
      function OG() {
        document.getElementById("Main").style.display = "none";
        document.getElementById("Games").style.display = "block";
      }

      function OT() {
        document.getElementById("Main").style.display = "none";
        document.getElementById("Tutor").style.display = "block";
      }
      
      function OI() {
        document.getElementById("Main").style.display = "none";
        document.getElementById("Intro").style.display = "block";
      }
    </script>
  </body>
</html>
