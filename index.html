<!DOCTYPE>
<html>
  <head>
    <title>Tien Games</title>

    <style>
      .butt {
      position: absolute;
      width: 140px;
      height: 60px;
      font-size: 18px;
      color: white;
      border-radius: 15px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      }
      .butt:hover {
        filter: brightness(1.2);
      }
      .butt:active {
        transform: scale(0.95);
      }
    </style>
    <audio id="bgMusic" src="Fur-Elise.mp3" loop></audio>
  </head>
  <body>
    <h1 style="text-align: center; color: lightblue;">
    Welcome to Tien Games🥳
    </h1> <hr>
    <h3 style="text-align: center;">
      Here are some options for you to choose from
    </h3> <br> <br>
    <button class="butt" style="
      left: 15%;
      background-color: green;
    ">Play Games</button>
    
    <button class="butt" style="
      left: 40%;
      background-color: blue;
    ">Tutorial</button>

    <button class="butt" style="
      left: 65%;
      background-color: brown;
      ">Introduce</button>

    <script>
  const bgMusic = document.getElementById("bgMusic");

  bgMusic.volume = 0.3;

  bgMusic.play().catch(() => {
    console.log("nah");
  });
</script>
  </body>
</html>
